plugins {
    id "multiloader-loader"
    id "net.fabricmc.fabric-loom"
}

loom {
    def aw = project(":${project.rootProject.name}-common").file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")

            if (project.hasProperty("mc_uuid")) {
                programArgs("--uuid", project.mc_uuid)
            }

            if (project.hasProperty("mc_username")) {
                programArgs("--username", project.mc_username)
            }
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${minecraft_version}"

    // Dependencies we use for this mod to run as we expect it to.
    //implementation "net.tslat.smartbrainlib:SmartBrainLib-fabric-${minecraft_version}:${smart_brain_lib_fabric_version}"
    //implementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_fabric_version}"
    //implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-${minecraft_version}:${resourceful_config_fabric_version}"
    implementation "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_fabric_version}"
    // Optional
    implementation "maven.modrinth:jade:${jade_fabric_version}+fabric"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}
